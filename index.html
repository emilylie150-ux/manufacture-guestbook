<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Guestbook Manufacture 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
  <a class="navbar__brand" href="#" aria-label="Kurnia Safety Supplies">
    <img class="navbar__logo" src="kss-logo-2.webp" alt="KSS Kurnia Safety Supplies">
  </a>
</header>

  <main class="hero">
    <div class="glow glow-green" aria-hidden="true"></div>
    <div class="glow glow-mint" aria-hidden="true"></div>

    <section class="hero__content">
      <p class="label"><span class="label__dot"></span>Manufacturing 2026</p>

      <h1>Guestbook</h1>

      <p class="intro">Thanks for visiting our booth. Leave your details and we will stay in touch.</p>

      <a class="cta" href="https://forms.cloud.microsoft/r/3V4aAYXtK4" id="guestbook-btn">
        <span class="cta__text">Click here</span>
        <span class="cta__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </span>
      </a>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
